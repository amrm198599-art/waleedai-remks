name: Android signed release (from zip)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # only used to attach files to a GitHub Release on tag pushes

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: project
    env:
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'waleed' }}
      CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project (the .zip file in the repo root)
        working-directory: .
        run: |
          ZIP=$(ls ./*.zip 2>/dev/null | head -n1)
          [ -n "$ZIP" ] || { echo "::error::Upload the project .zip file to the repo root first"; exit 1; }
          echo "Using $ZIP"
          mkdir project && unzip -q "$ZIP" -d project
          [ -f project/package.json ] || { echo "::error::package.json not found at the top of the zip"; exit 1; }

      - name: Check signing secrets exist
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYPW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          [ -n "$B64" ]     || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"; missing=1; }
          [ -n "$STOREPW" ] || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is missing"; missing=1; }
          [ -n "$KEYPW" ]   || { echo "::error::Secret ANDROID_KEY_PASSWORD is missing"; missing=1; }
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npx vite build

      - name: Prepare Android project (regenerate if incomplete, add signing block)
        run: node scripts/android-prepare.mjs

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Restore keystore
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Verify keystore password and alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD \
            || { echo "::error::Keystore password or alias ('$KEY_ALIAS') is wrong"; exit 1; }

      - name: Set version
        run: |
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "ANDROID_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "ANDROID_VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK and AAB
        working-directory: project/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify APK signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Rename outputs
        run: |
          mkdir -p out
          cp "$APK" "out/Waleed-AI-${ANDROID_VERSION_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/Waleed-AI-${ANDROID_VERSION_NAME}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: Waleed-AI-signed-${{ env.ANDROID_VERSION_NAME }}
          path: project/out/*
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: project/out/*

      - name: Delete keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
